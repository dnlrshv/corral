name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[query,preflight,memory]" pytest
      - run: python -m pytest tests/ -q

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The rule selection lives in pyproject.toml; the version is pinned so that a
      # new ruff release cannot fail an unrelated change.
      - run: python -m pip install ruff==0.16.8
      - run: ruff check --output-format=github .

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the scan covers every commit reachable from the checked-out
          # commit, so every commit of a pull request or push.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # Built through the Go module proxy, which verifies the module checksum against
      # the public checksum database. (gitleaks-action scans only the first 30 commits
      # the pull-request API lists.)
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      # Uses .gitleaks.toml from the repository root.
      - run: '"$(go env GOPATH)/bin/gitleaks" git --redact --verbose --log-opts=HEAD .'
