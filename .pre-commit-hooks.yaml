- id: surface-check
  name: corral surface check
  description: Check staged changes against declared high-risk surfaces.
  entry: corral-surface-check
  language: python
  pass_filenames: false
  always_run: true

- id: magic-numbers
  name: corral magic-number lint
  description: Flag numeric literals that duplicate configured constants.
  entry: corral-magic-numbers
  language: python
  pass_filenames: false
  always_run: true

- id: instructions-lint
  name: corral instructions lint
  description: Flag dated prompting patterns and dead references in agent instruction files.
  entry: corral-instructions-lint --only-configured
  language: python
  types: [text]
  pass_filenames: true
